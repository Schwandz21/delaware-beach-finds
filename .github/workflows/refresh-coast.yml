# Delaware Beach Finds — daily coast conditions refresh
#
# Pulls National Weather Service forecast + alerts and NOAA CO-OPS tides +
# water temperature into data/coast-now.json, then commits only if something
# actually changed. Deliberately separate from publish-scheduled.yml: a weather
# refresh must never be able to publish a story.

name: Refresh coast conditions and events

on:
  schedule:
    # Four times a day, offset off the hour to be a polite API citizen.
    - cron: '17 9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dbf-coast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch official conditions
        run: python3 scripts/fetch_coast_now.py

      # Independent of the conditions fetch: either can fail without the other.
      # ingest_events.py exits 1 only when EVERY source failed, in which case it
      # has already left the existing file untouched.
      - name: Ingest coastal events
        run: python3 scripts/ingest_events.py || echo "all event sources failed; previous data retained"


      # Fixture-based, so it passes with or without a live network.
      - name: Validate the daily layer
        run: |
          python3 scripts/test_coast_today.py
          python3 scripts/test_event_engine.py

      - name: Commit refreshed conditions
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/coast-now.json data/events-generated.json)" ]; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name  "dbf-publisher[bot]"
          git config user.email "dbf-publisher[bot]@users.noreply.github.com"
          git add data/coast-now.json data/events-generated.json
          git commit -m "Refresh coast conditions and events ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
