name: DBF Freshness Check

on:
  schedule:
    # 12:00 UTC daily (~8am Eastern). GitHub Actions cron is best-effort timing.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic test suite
        id: tests
        continue-on-error: true
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Run freshness report
        id: freshness
        run: |
          set +e
          python3 scripts/freshness_report.py --json > freshness-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat freshness-report.json
          set -e

      - name: Read report summary
        id: summary
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("freshness-report.json"))
          status = d.get("overallStatus", "UNKNOWN")
          warnings = list(d.get("warnings", []))
          if "${{ steps.tests.outcome }}" == "failure":
              status = "REVIEW NEEDED"
              warnings.append("scripts/run_tests.sh failed — see the 'Run deterministic test suite' step log for detail.")
          print(f"status={status}")
          body = "\n".join(f"- {w}" for w in warnings) or "- (no warnings — this run should not be reachable if status is REVIEW NEEDED)"
          print("body<<EOF")
          print(body)
          print("EOF")
          PYEOF

      # ---- This job enforces and warns. It never researches or invents
      # ---- events — that only happens in the human-approved weekly
      # ---- candidate flow (see automation/CLAUDE_WEEKLY_FRESHNESS_PROMPT.md).
      - name: Open or update freshness issue
        if: steps.summary.outputs.status != 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "DBF freshness: review needed";
            const body = [
              "Automated daily freshness check found something that needs human review.",
              "",
              "${{ steps.summary.outputs.body }}",
              "",
              "Run `python3 scripts/freshness_report.py` locally for the full report, or use `UPDATE_DBF_FRESHNESS.command` to review and apply a new candidate.",
              "",
              `_Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
            ].join("\n");

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "freshness"
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["freshness"]
              });
            }

      - name: Close freshness issue if now clean
        if: steps.summary.outputs.status == 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "DBF freshness: review needed";
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "freshness"
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Freshness data is current again — closing automatically."
              });
            }
