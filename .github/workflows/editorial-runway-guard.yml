name: DBF editorial runway guard

# The 72-hour failsafe for the editorial autopilot (see
# data/editorial-autopilot.json and scripts/runway_guard.py). It reports; it
# never edits content, researches, or publishes. One GitHub issue is kept up
# to date while anything needs attention and closed when the queue is healthy.

on:
  schedule:
    # Every six hours, off the hour.
    - cron: "41 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: dbf-runway-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run runway guard
        id: guard
        run: |
          set +e
          python3 scripts/runway_guard.py
          python3 scripts/runway_guard.py --json > runway-guard.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Summarise
        id: summary
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("runway-guard.json"))
          r = d["runway"]
          print("healthy=%s" % ("true" if d["healthy"] else "false"))
          lines = ["- " + p for p in d["problems"]] or ["- (none)"]
          lines += ["", "**Runway:** %d scheduled, ends %s (%.1f days), largest planned gap %sh."
                    % (r["scheduledCount"], r["runwayEnd"], r["runwayDays"], r["maxGapHours"])]
          lines += ["**Homepage lead:** %s" % json.dumps(d["lead"])]
          if r["scheduled"]:
              lines += ["", "| Publishes | Story |", "| --- | --- |"]
              lines += ["| %s | %s |" % (s["at"], s["headline"]) for s in r["scheduled"]]
          print("body<<EOF")
          print("\n".join(lines))
          print("EOF")
          PYEOF

      - name: Open or update the autopilot issue
        if: steps.summary.outputs.healthy != 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.summary.outputs.body }}
        with:
          script: |
            const title = "DBF editorial autopilot: attention required";
            const body = [
              "The editorial runway guard found a problem with the story autopilot.",
              "",
              process.env.REPORT,
              "",
              "Restore the runway with the editorial autopilot research task (automation/CLAUDE_EDITORIAL_AUTOPILOT_PROMPT.md), or run `python3 scripts/editorial_autopilot.py --status` locally.",
              "",
              `_Last checked: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["editorial-autopilot"]
              });
            }

      - name: Close the autopilot issue when healthy
        if: steps.summary.outputs.healthy == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.summary.outputs.body }}
        with:
          script: |
            const title = "DBF editorial autopilot: attention required";
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: "Runway guard is healthy again — closing automatically.\n\n" + process.env.REPORT
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed"
              });
            }

      - name: Fail when attention is required
        if: steps.summary.outputs.healthy != 'true'
        run: |
          echo "Runway guard: attention required (see the issue above)."
          exit 1
