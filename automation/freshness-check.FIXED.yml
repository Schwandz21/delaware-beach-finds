name: DBF Freshness Check

on:
  schedule:
    # 12:00 UTC daily (~8am Eastern). GitHub Actions cron is best-effort timing.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic test suite
        id: tests
        continue-on-error: true
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Run freshness report
        id: freshness
        run: |
          set +e
          python3 scripts/freshness_report.py --json > freshness-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat freshness-report.json
          set -e

      # Only the status enum goes through GITHUB_OUTPUT. The report body is
      # arbitrary generated prose (quotes, apostrophes, backticks, newlines,
      # URLs, Markdown, Unicode) and is written to a FILE instead. It is never
      # interpolated into JavaScript source or into a heredoc delimiter, which
      # is what broke this workflow every day from 2026-08-01.
      - name: Read report summary
        id: summary
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 scripts/build_freshness_issue_body.py \
            --report freshness-report.json \
            --tests-outcome "$TESTS_OUTCOME" \
            --body-out freshness-issue-body.md \
            --status-out "$GITHUB_OUTPUT"

      # ---- This job enforces and warns. It never researches or invents
      # ---- events — that only happens in the human-approved weekly
      # ---- candidate flow (see automation/CLAUDE_WEEKLY_FRESHNESS_PROMPT.md).
      - name: Open or update freshness issue
        if: steps.summary.outputs.status != 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "DBF freshness: review needed";
            // Read as data, never as source. Any character is safe here.
            const report = fs.readFileSync("freshness-issue-body.md", "utf8");
            const body = [
              "Automated daily freshness check found something that needs human review.",
              "",
              report,
              "",
              "Run `python3 scripts/freshness_report.py` locally for the full report, or use `UPDATE_DBF_FRESHNESS.command` to review and apply a new candidate.",
              "",
              `_Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
            ].join("\n");

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "freshness"
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["freshness"]
              });
            }

      - name: Close freshness issue if now clean
        if: steps.summary.outputs.status == 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "DBF freshness: review needed";
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "freshness"
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Freshness data is current again — closing automatically."
              });
            }
